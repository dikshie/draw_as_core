name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Test & Smoke Build (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Pytest Suite (IPv4 & IPv6)
        run: pytest -v test_as_core.py test_as_core_IPv6.py

      - name: Smoke Test - Generate Global IPv4 & IPv6 Topology
        run: |
          python as_core.py -c GLOBAL -o as_core_smoke.png
          python as_core_IPv6.py -c GLOBAL -o as_core_ipv6_smoke.png
          python as_core.py -c ID -o as_core_id_smoke.png
          python as_core_IPv6.py -c ID -o as_core_ipv6_id_smoke.png

      - name: Upload Smoke Test Artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-visualizations
          path: "*smoke.png"
          retention-days: 7
